Configuration:
  name: DFLManager
  status: ${env:LOGGING_LOG_LEVEL:-fatal}
  dest: err

  Appenders:
    Console:
      name: STDOUT
      target: SYSTEM_OUT
      PatternLayout:
        Pattern: "%p %m%n"
    Syslog:
      name: SYSLOG
      format: RFC5424
      host: ${env:SYSLOG_HOST:-localhost}
      port: ${env:SYSLOG_PORT:-1514}
      protocol: TCP
      facility: LOCAL0
      appName: DFLManager
      messageId: Worker
      newline: true
  
  Loggers:
    Logger:
      -
        name: stdout-logger
        level: ${env:APP_LOG_LEVEL:-info}
        additivity: false
        AppenderRef:
          ref: STDOUT
      -
        name: syslog-logger
        level: ${env:APP_LOG_LEVEL:-info}
        additivity: false
        AppenderRef:
          ref: SYSLOG
      -
        name: stdout-with-syslog-logger
        level: ${env:APP_LOG_LEVEL:-info}
        additivity: false
        AppenderRef:
          - ref: STDOUT
          - ref: SYSLOG
    Root:
      level: ${env:APP_LOG_LEVEL:-info}

