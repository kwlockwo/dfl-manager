name: Tests

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dflmngr_test
          POSTGRES_USER: dflmngr
          POSTGRES_PASSWORD: dflmngr_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Setup PostgreSQL schema
      env:
        PGPASSWORD: dflmngr_test_password
      run: |
        # Wait for PostgreSQL to be ready
        until pg_isready -h localhost -p 5432 -U dflmngr; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        echo "PostgreSQL is ready!"

        # Create schema if needed
        # psql -h localhost -U dflmngr -d dflmngr_test -c "CREATE SCHEMA IF NOT EXISTS dflmngr;"

    - name: Run tests
      env:
        # PostgreSQL connection for GitHub Actions
        DB_URL: jdbc:postgresql://localhost:5432/dflmngr_test
        DB_USER: dflmngr
        DB_PASSWORD: dflmngr_test_password
        DB_DRIVER: org.postgresql.Driver
        DB_PLATFORM: org.eclipse.persistence.platform.database.PostgreSQLPlatform
      run: |
        # Override persistence.xml properties with environment variables
        mvn test --batch-mode --fail-at-end \
          -Djakarta.persistence.jdbc.url="${DB_URL}" \
          -Djakarta.persistence.jdbc.user="${DB_USER}" \
          -Djakarta.persistence.jdbc.password="${DB_PASSWORD}" \
          -Djakarta.persistence.jdbc.driver="${DB_DRIVER}" \
          -Declipselink.target-database="${DB_PLATFORM}"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/

    - name: Publish test report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true
