Configuration:
  name: DFLManager
  status: ${env:LOGGING_LOG_LEVEL:-fatal}
  dest: err

  Appenders:
    Console:
      name: STDOUT
      target: SYSTEM_OUT
      PatternLayout:
        Pattern: "%p %m%n"
  
  Loggers:
    Logger:
      -
        name: stdout-logger
        level: ${env:APP_LOG_LEVEL:-info}
        additivity: false
        AppenderRef:
          ref: STDOUT
    Root:
      level: ${env:APP_LOG_LEVEL:-info}

