name: Docker Build & Test

on:
  push:
    branches: [ main, develop, monorepo ]
  pull_request:
    branches: [ main, develop, monorepo ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build scheduler image
      run: |
        docker build -f Dockerfile.scheduler -t dfl-manager:scheduler .

    - name: Build web image
      run: |
        docker build -f Dockerfile.web -t dfl-manager:web .

    - name: Run tests in scheduler build
      run: |
        # Extract build stage for testing
        docker build -f Dockerfile.scheduler --target build -t dfl-manager:scheduler-build .
        docker run --rm dfl-manager:scheduler-build ./mvnw test -B -pl common,scheduler

    - name: Test scheduler image
      run: |
        # Check if Chrome is installed (needed for Selenium)
        docker run --rm --entrypoint sh dfl-manager:scheduler -c "which google-chrome-stable || which google-chrome || which chromium-browser"

    - name: Test web image
      run: |
        # Verify web JAR was built
        docker run --rm --entrypoint ls dfl-manager:web -la /app/dfl-manager-web.jar

    - name: Verify image sizes
      run: |
        echo "Docker image sizes:"
        docker images | grep dfl-manager

    - name: Test docker-compose configuration
      run: |
        # Validate docker-compose file
        docker compose config

    - name: Report success
      run: |
        echo "✅ All Docker builds completed successfully"
        echo "✅ Scheduler image includes Chrome for Selenium"
        echo "✅ Web image is lightweight without Chrome"
        echo "✅ docker-compose.yml validated"
