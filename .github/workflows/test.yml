name: Tests

on:
  push:
    branches: [ main, develop, feature/**, monorepo ]
  pull_request:
    branches: [ main, develop, monorepo ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Check if monorepo branch
      id: check_branch
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/monorepo" ]] || [[ "${{ github.base_ref }}" == "monorepo" ]]; then
          echo "is_monorepo=true" >> $GITHUB_OUTPUT
        else
          echo "is_monorepo=false" >> $GITHUB_OUTPUT
        fi

    - name: Run tests (main/develop branches)
      if: steps.check_branch.outputs.is_monorepo == 'false'
      run: |
        # Run all tests with code coverage
        mvn test --batch-mode --fail-at-end

    - name: Skip tests (monorepo branch - Phase 1)
      if: steps.check_branch.outputs.is_monorepo == 'true'
      run: |
        echo "⚠️  Skipping tests on monorepo branch (Phase 1)"
        echo "The monorepo branch currently has an EclipseLink metamodel generation issue."
        echo "Tests will be enabled in Phase 2 after migration to Spring Data JPA."
        echo "See MONOREPO_README.md for details."
        exit 0

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always() && steps.check_branch.outputs.is_monorepo == 'false'
      with:
        name: test-results
        path: target/surefire-reports/

    - name: Publish test report
      uses: dorny/test-reporter@v1
      if: always() && steps.check_branch.outputs.is_monorepo == 'false'
      with:
        name: Test Results
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true
