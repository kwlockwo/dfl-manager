name: Docker Build & Test

on:
  push:
    branches: [ main, develop, monorepo ]
  pull_request:
    branches: [ main, develop, monorepo ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build scheduler image
      run: |
        docker build -f Dockerfile.scheduler -t dfl-manager:scheduler .

    - name: Build web image
      run: |
        docker build -f Dockerfile.web -t dfl-manager:web .

    - name: Run tests in scheduler build
      run: |
        # Extract build stage for testing
        docker build -f Dockerfile.scheduler --target build -t dfl-manager:scheduler-build .
        docker run --rm dfl-manager:scheduler-build ./mvnw test -B -pl common,scheduler

    - name: Test scheduler image
      run: |
        # Start a test container to verify it runs
        docker run --rm --name scheduler-test -d \
          -e DATABASE_URL=jdbc:postgresql://localhost:5432/test \
          -e DATABASE_USER=test \
          -e DATABASE_PASSWORD=test \
          dfl-manager:scheduler --help || true

        # Give it a moment to start
        sleep 5

        # Check if Chrome is installed (needed for Selenium)
        docker run --rm dfl-manager:scheduler which google-chrome

    - name: Test web image
      run: |
        # Start a test container to verify it runs
        docker run --rm --name web-test -d \
          -e JDBC_DATABASE_URL=jdbc:postgresql://localhost:5432/test \
          -e JDBC_DATABASE_USERNAME=test \
          -e JDBC_DATABASE_PASSWORD=test \
          -p 8080:8080 \
          dfl-manager:web

        # Give it a moment to start
        sleep 10

        # Check if web server responds (should fail due to no DB, but container should start)
        docker logs web-test

        # Stop the test container
        docker stop web-test || true

    - name: Verify image sizes
      run: |
        echo "Docker image sizes:"
        docker images | grep dfl-manager

    - name: Test docker-compose configuration
      run: |
        # Validate docker-compose file
        docker compose config

    - name: Report success
      run: |
        echo "✅ All Docker builds completed successfully"
        echo "✅ Scheduler image includes Chrome for Selenium"
        echo "✅ Web image is lightweight without Chrome"
        echo "✅ docker-compose.yml validated"
