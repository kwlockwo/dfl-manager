Configuration:
  name: DFLManager
  status: ${env:LOGGING_LOG_LEVEL:-fatal}
  dest: err

  Appenders:
    Console:
      name: STDOUT
      target: SYSTEM_OUT
      PatternLayout:
        Pattern: "%p %m%n%ex"
    Syslog:
      name: SYSLOG
      format: RFC5424
      host: ${env:SYSLOG_HOST:-localhost}
      port: ${env:SYSLOG_PORT:-1514}
      protocol: TCP
      facility: LOCAL0
      appName: DFLManager
      messageId: Worker
      newline: true
    Loki:
      name: LOKI
      host: ${env:LOKI_URL:-http://localhost:3100}
      PatternLayout:
        Pattern: "%m%n%ex"
      Label:
        Pattern: "app=DFLManager,level=%p,scheduler_job=%X{scheduler_job},scheduler_job_class=%X{scheduler_job_class},handler=%X{handler},mdcKey=%X{mdcKey},loggerName=%X{loggerName}"

  Loggers:
    Logger:
      -
        name: stdout-logger
        level: ${env:APP_LOG_LEVEL:-info}
        additivity: false
        AppenderRef:
          ref: STDOUT
      -
        name: syslog-logger
        level: ${env:APP_LOG_LEVEL:-info}
        additivity: false
        AppenderRef:
          ref: SYSLOG
      -
        name: stdout-with-syslog-logger
        level: ${env:APP_LOG_LEVEL:-info}
        additivity: false
        AppenderRef:
          - ref: STDOUT
          - ref: SYSLOG
      -
        name: loki-logger
        level: ${env:APP_LOG_LEVEL:-info}
        additivity: false
        AppenderRef:
          ref: LOKI
      -
        name: stdout-with-loki-logger
        level: ${env:APP_LOG_LEVEL:-info}
        additivity: false
        AppenderRef:
          - ref: STDOUT
          - ref: LOKI
    Root:
      level: ${env:APP_LOG_LEVEL:-info}

