spring:
  application:
    name: dfl-manager-scheduler

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:dflmngrdb}
    username: ${DATABASE_USER:dflmngr}
    password: ${DATABASE_PASSWORD:dflmngr}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: false  # Migrations run via pre-deploy hook only

  main:
    web-application-type: none
    banner-mode: off

logging:
  level:
    root: INFO
    net.dflmngr: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework: WARN
  config: classpath:log4j2-local.yaml

---
# Production profile - uses syslog logging
spring:
  config:
    activate:
      on-profile: production

logging:
  config: classpath:log4j2.yaml
