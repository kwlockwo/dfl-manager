# Spring Boot Test Configuration for DFL Manager Common Module
# Uses H2 locally, PostgreSQL in CI (via environment variables)

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    # Auto-detect database platform (H2 or PostgreSQL)
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jakarta.persistence.sharedCache.mode: UNSPECIFIED
      jakarta:
        persistence:
          sharedCache:
            mode: UNSPECIFIED
    open-in-view: false

  # Disable Flyway for tests (use Hibernate schema generation)
  flyway:
    enabled: false

  # Disable auto-configuration for batch processing
  batch:
    job:
      enabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    net.dflmngr: DEBUG
