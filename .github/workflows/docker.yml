name: Docker Build & Test

on:
  push:
    branches: [ main, develop, monorepo ]
  pull_request:
    branches: [ main, monorepo ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check if monorepo branch
      id: check_branch
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/monorepo" ]] || [[ "${{ github.base_ref }}" == "monorepo" ]]; then
          echo "is_monorepo=true" >> $GITHUB_OUTPUT
        else
          echo "is_monorepo=false" >> $GITHUB_OUTPUT
        fi

    - name: Build Docker image with tests (main/develop)
      if: steps.check_branch.outputs.is_monorepo == 'false'
      run: |
        # Build and tag the build stage (has Maven + JDK)
        docker build --target build -t dfl-manager:build .

        # Run tests in the build stage container
        docker run --rm dfl-manager:build ./mvnw test --batch-mode

        # Build final production image to verify it works
        docker build -t dfl-manager:test .

    - name: Skip Docker build (monorepo branch - Phase 1)
      if: steps.check_branch.outputs.is_monorepo == 'true'
      run: |
        echo "⚠️  Skipping Docker build on monorepo branch (Phase 1)"
        echo "Docker build will be updated for multi-module structure in Phase 2."
        echo "See MONOREPO_README.md for details."
        exit 0
